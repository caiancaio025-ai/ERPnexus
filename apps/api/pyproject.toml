[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "reportlab>=4.2,<5"
]

[project.optional-dependencies]
auth = [
  "argon2-cffi>=23.1,<26",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1"
]
ai = [
  "google-genai>=1.26,<2",
  "httpx>=0.28,<1"
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.16,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.12,<1"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "performance: testes de desempenho executados somente sob demanda"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
